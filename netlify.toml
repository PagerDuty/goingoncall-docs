
# netlify.toml — goingoncall.pagerduty.com
# This site now only redirects to docs.pagerduty.com/ops-guides/going-on-call.

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
# These are attached to the 301 responses too. Referrer-Policy matters here:
# a redirect response's Referrer-Policy is applied to the follow-up request,
# so "same-origin" would strip the referrer when the browser goes on to
# docs.pagerduty.com (cross-origin), and docs analytics would lose the
# original traffic source (Google, blogs, Slack, etc.).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# Redirects — first match wins. Keep the catch-all LAST.
# force = true is required because the old MkDocs build output (if still
# deployed) would otherwise shadow these rules.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/"
  to = "https://docs.pagerduty.com/ops-guides/going-on-call"
  status = 301
  force = true

[[redirects]]
  from = "/intro/*"
  to = "https://docs.pagerduty.com/ops-guides/going-on-call/introduction"
  status = 301
  force = true

[[redirects]]
  from = "/tech/*"
  to = "https://docs.pagerduty.com/ops-guides/going-on-call/technical-preparations"
  status = 301
  force = true

[[redirects]]
  from = "/people/*"
  to = "https://docs.pagerduty.com/ops-guides/going-on-call/setting-team-norms"
  status = 301
  force = true

[[redirects]]
  from = "/culture/*"
  to = "https://docs.pagerduty.com/ops-guides/going-on-call/building-on-call-culture"
  status = 301
  force = true

[[redirects]]
  from = "/managers/*"
  to = "https://docs.pagerduty.com/ops-guides/going-on-call/recommendations-for-managers"
  status = 301
  force = true

[[redirects]]
  from = "/implementation/*"
  to = "https://docs.pagerduty.com/ops-guides/going-on-call/implementation-suggestions"
  status = 301
  force = true

[[redirects]]
  from = "/next_steps/*"
  to = "https://docs.pagerduty.com/ops-guides/going-on-call/next-steps"
  status = 301
  force = true

[[redirects]]
  from = "/resources/*"
  to = "https://docs.pagerduty.com/ops-guides/going-on-call/additional-resources"
  status = 301
  force = true

# Catch-all: assets, sitemap.xml, search index, unknown/mistyped URLs
[[redirects]]
  from = "/*"
  to = "https://docs.pagerduty.com/ops-guides/going-on-call"
  status = 301
  force = true
